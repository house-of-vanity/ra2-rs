[package]
name = "ra2-rs"
version = "0.1.0-rc1"
edition = "2024"
rust-version = "1.97.1"

[workspace]
members = ["crates/arena-core", "crates/ra2-formats", "crates/arena-runtime", "crates/arena-net", "crates/arena-net-io", "crates/arena-net-lab"]
resolver = "3"

[workspace.dependencies]
glam = "=0.33.12"
serde = { version = "=1.0.229", features = ["derive"] }
ron = "=0.12.2"
flate2 = "=1.1.10"
bevy = { version = "=0.20.0", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "keyboard", "mouse", "bevy_audio", "mp3",
    "bevy_asset", "bevy_camera", "bevy_color", "bevy_core_pipeline",
    "bevy_image", "bevy_light", "bevy_log", "bevy_material", "bevy_mesh",
    "bevy_pbr", "bevy_render", "bevy_shader", "bevy_window", "bevy_winit",
    "wayland", "x11", "system_clipboard", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets", "ui_picking", "bevy_text", "default_font", "png", "bmp", "tga",
] }
bevy_rapier3d = { version = "=0.37.0", default-features = false, features = ["dim3", "parallel", "profiler", "fem"] }
arena-core = { path = "crates/arena-core" }
ra2-formats = { path = "crates/ra2-formats" }
arena-runtime = { path = "crates/arena-runtime" }

[dependencies]
ab_glyph = "=0.2.32"
unicode-segmentation = "=1.13.3"
bevy.workspace = true
bevy_rapier3d.workspace = true
arena-core.workspace = true
ra2-formats.workspace = true
arena-runtime.workspace = true
arena-net = { path = "crates/arena-net" }
arena-net-io = { path = "crates/arena-net-io" }
blake3 = "=1.8.7"
postcard = { version = "=1.1.3", default-features = false }
serde.workspace = true
ron.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
winit = { version = "=0.30.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
embed-resource = "=3.0.12"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

# The release executable contains all engine-side defaults and needs no sidecars.
[profile.release]
strip = "symbols"
